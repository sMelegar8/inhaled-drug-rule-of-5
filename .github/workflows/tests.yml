name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install "numpy>=2.0" "pandas>=3.0" "scipy>=1.13"
      - name: Check that the scripts compile
        run: python -m compileall -q src tests
      - name: Validate app statistics against numpy, pandas and scipy
        run: python tests/validate_stats.py
